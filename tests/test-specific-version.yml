name: Test specific version install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: v0.30.0
      - name: Assert installed version matches
        run: |
          OUT="$(atlas version 2>&1)"
          echo "actual: $OUT"
          if ! echo "$OUT" | grep -q "v0.30.0"; then
            echo "FAIL: expected atlas version v0.30.0"
            exit 1
          fi
          echo "PASS"
