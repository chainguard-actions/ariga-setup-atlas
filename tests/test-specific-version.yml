name: Test specific version install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Resolve a currently supported explicit Atlas version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(curl -sSf -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/ariga/atlas/releases/latest \
            | grep -m1 '"tag_name"' | sed -E 's/.*"tag_name"[^"]*"([^"]+)".*/\1/' || true)"
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Could not resolve latest tag (got '$TAG'), falling back"
            TAG="v0.38.0"
          fi
          echo "Using version: $TAG"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        with:
          version: ${{ steps.ver.outputs.version }}
      - name: Assert installed version matches
        env:
          EXPECTED: ${{ steps.ver.outputs.version }}
        run: |
          OUT="$(atlas version 2>&1)"
          echo "atlas version output: $OUT"
          NUM="${EXPECTED#v}"
          if ! echo "$OUT" | grep -qF "$NUM"; then
            echo "FAIL: expected version $EXPECTED"
            exit 1
          fi
          echo "PASS"
