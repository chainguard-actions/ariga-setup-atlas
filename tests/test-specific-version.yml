name: Test specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: v0.30.0
      - name: Assert requested version installed
        run: |
          ATLAS_BIN="$(command -v atlas || true)"
          echo "which: $ATLAS_BIN"
          if [ -z "$ATLAS_BIN" ]; then
            echo "FAIL: atlas not found on PATH"
            exit 1
          fi
          out="$(atlas version)"
          echo "atlas version: $out"
          if ! echo "$out" | grep -q "0\.30\.0"; then
            echo "FAIL: expected version 0.30.0"
            exit 1
          fi
          echo "PASS"
