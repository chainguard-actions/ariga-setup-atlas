name: Test specific version install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Resolve a currently supported Atlas release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTH=()
          if [ -n "$GH_TOKEN" ]; then AUTH=(-H "Authorization: Bearer $GH_TOKEN"); fi
          JSON="$(curl -sSfL "${AUTH[@]}" https://api.github.com/repos/ariga/atlas/releases/latest || curl -sSfL https://api.github.com/repos/ariga/atlas/releases/latest)"
          TAG="$(echo "$JSON" | grep -m1 '"tag_name"' | sed -E 's/.*"tag_name"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')"
          echo "resolved tag: $TAG"
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: could not resolve a release tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        with:
          version: ${{ steps.resolve.outputs.tag }}
      - name: Assert requested version installed
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          if ! command -v atlas >/dev/null 2>&1; then
            echo "FAIL: atlas not found on PATH"
            exit 1
          fi
          OUT="$(atlas version)"
          echo "atlas version output: $OUT"
          NUM="${TAG#v}"
          if ! echo "$OUT" | grep -qF "$NUM"; then
            echo "FAIL: expected version $NUM"
            exit 1
          fi
          echo "PASS"
