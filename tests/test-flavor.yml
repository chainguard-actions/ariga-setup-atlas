name: Test flavor (extended) install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: latest
          flavor: extended
      - name: Assert extended atlas installed and on PATH
        run: |
          if ! command -v atlas >/dev/null 2>&1; then
            echo "FAIL: atlas not found on PATH"
            exit 1
          fi
          echo "atlas location: $(command -v atlas)"
          case "$(command -v atlas)" in
            "$HOME/.atlas-bin/atlas") ;;
            *) echo "FAIL: atlas not installed into \$HOME/.atlas-bin"; exit 1 ;;
          esac
          OUT="$(atlas version)"
          echo "atlas version output: $OUT"
          if ! echo "$OUT" | head -n1 | grep -qiE 'atlas.*version'; then
            echo "FAIL: unexpected atlas version output"
            exit 1
          fi
          echo "PASS"
