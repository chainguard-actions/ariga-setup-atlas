name: Test cloud-token whitespace-only is trimmed and skipped
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: latest
          cloud-token: "   "
      - name: Assert atlas installed
        run: |
          if ! command -v atlas >/dev/null 2>&1; then
            echo "FAIL: atlas not found on PATH"
            exit 1
          fi
          atlas version
          echo "PASS: atlas installed"
      - name: Assert ATLAS_TOKEN not exported for whitespace-only token
        run: |
          echo "ATLAS_TOKEN length: ${#ATLAS_TOKEN}"
          if [ -n "${ATLAS_TOKEN:-}" ]; then
            echo "FAIL: ATLAS_TOKEN should not be set when token trims to empty"
            exit 1
          fi
          echo "PASS: ATLAS_TOKEN not set"
