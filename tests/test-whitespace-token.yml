name: Test whitespace-only cloud token skips login
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cloud-token: "   "
      - name: Assert atlas installed and no token exposed
        run: |
          if ! command -v atlas >/dev/null 2>&1; then
            echo "FAIL: atlas not found on PATH"
            exit 1
          fi
          echo "ATLAS_TOKEN length: ${#ATLAS_TOKEN}"
          if [ -n "${ATLAS_TOKEN:-}" ]; then
            echo "FAIL: ATLAS_TOKEN should not be set for whitespace-only token"
            exit 1
          fi
          echo "PASS"
