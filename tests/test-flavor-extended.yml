name: Test extended flavor
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          flavor: extended
      - name: Assert atlas (extended) installed
        run: |
          if ! command -v atlas >/dev/null 2>&1; then
            echo "FAIL: atlas not found on PATH"
            exit 1
          fi
          out="$(atlas version)"
          echo "version output: $out"
          if ! echo "$out" | grep -qi "atlas"; then
            echo "FAIL: unexpected version output"
            exit 1
          fi
          echo "PASS"
