name: Test basic usage (latest)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert atlas installed and on PATH
        run: |
          ATLAS_BIN="$(command -v atlas || true)"
          echo "which: $ATLAS_BIN"
          if [ -z "$ATLAS_BIN" ] || [ ! -x "$ATLAS_BIN" ]; then
            echo "FAIL: atlas not found on PATH"
            echo "PATH=$PATH"
            exit 1
          fi
          out="$(atlas version)"
          echo "atlas version: $out"
          if ! echo "$out" | grep -qi "atlas version v"; then
            echo "FAIL: unexpected atlas version output"
            exit 1
          fi
          echo "PASS"
      - name: Assert ATLAS_TOKEN not exported without cloud-token
        run: |
          if [ -n "${ATLAS_TOKEN:-}" ]; then
            echo "FAIL: ATLAS_TOKEN should not be set"
            exit 1
          fi
          echo "PASS"
