name: Test basic usage (latest)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert atlas is installed and on PATH
        run: |
          set -e
          echo "which atlas: $(command -v atlas || true)"
          if ! command -v atlas >/dev/null 2>&1; then
            echo "FAIL: atlas not found on PATH"
            exit 1
          fi
          if [ ! -x "$HOME/.atlas-bin/atlas" ]; then
            echo "FAIL: expected binary at $HOME/.atlas-bin/atlas"
            exit 1
          fi
          out="$(atlas version)"
          echo "version output: $out"
          if ! echo "$out" | grep -qi "atlas version"; then
            echo "FAIL: unexpected version output"
            exit 1
          fi
          echo "PASS"
