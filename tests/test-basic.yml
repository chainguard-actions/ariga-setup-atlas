name: Test basic install (latest)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert atlas is installed and runs
        run: |
          if ! command -v atlas >/dev/null 2>&1; then
            echo "FAIL: atlas not found on PATH"
            exit 1
          fi
          OUT="$(atlas version 2>&1)"
          echo "actual: $OUT"
          if ! echo "$OUT" | grep -qi "atlas"; then
            echo "FAIL: unexpected atlas version output"
            exit 1
          fi
          echo "PASS"
